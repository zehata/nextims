apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  ports:
  - port: 8000
    name: http
    targetPort: 8000
  type: ClusterIP
  selector:
    app: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: auth
        ports:
          - containerPort: 
        env:
          - name: REDIS_HOST
            value: "auth-db"
          - name: REDIS_PORT
            value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  ports:
  - port: 6379
    name: http
    targetPort: 6379
  type: ClusterIP
  selector:
    app: auth-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
spec:
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
      - name: auth-db
        image: auth-db
        ports:
          - containerPort: 6379
        volumeMounts:
          - name: auth-db-storage
            mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: auth-db-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi