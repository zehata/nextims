apiVersion: v1
kind: Service
metadata:
  name: api-cache
spec:
  ports:
  - port: 6379
    name: http
    targetPort: 6379
  type: ClusterIP
  selector:
    app: api-cache
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api-cache
spec:
  selector:
    matchLabels:
      app: api-cache
  template:
    metadata:
      labels:
        app: api-cache
    spec:
      containers:
      - name: api-cache
        image: api-cache
        ports:
          - containerPort: 6379